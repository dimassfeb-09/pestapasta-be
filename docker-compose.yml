services:
  backend:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: "9989"
      GIN_MODE: ${GIN_MODE:-release}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    expose:
      - "9989"
    # Database is external/third-party: connection comes from .env
    # (DB_HOST_PRODUCTION / DB_PORT_PRODUCTION / DB_USER_PRODUCTION / ...).
    # No postgres service is started by this compose.

# No volumes: database is managed externally.
